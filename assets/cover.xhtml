<?xml version="1.0" encoding="utf-8" standalone="no"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en" lang="en">
<head><title>{{ .title }}</title> </head>
<body class="cover">
<figure><img id="{{ .id }}" role="doc-cover" src="{{ .img.RelPermalink }}" />{{ with .caption }}<figcaption>{{ . }}</figcaption>{{ end }}</figure>
{{- site.Store.Add "epubImages" (dict "id" .id "href" .img.RelPermalink "mediaType" .img.MediaType.Type) -}}
</body>
</html>
